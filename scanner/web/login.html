<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clonetron · log in</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body class="login">
<form id="f">
  <div class="brand"><img src="/favicon.svg" width="30" height="30" alt="">Clonetron</div>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button class="primary" type="submit">Log in</button>
  <div id="m" class="msg err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const m = document.getElementById('m'); m.textContent = '';
  const r = await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('pw').value})});
  if (r.ok) location.href = '/';
  else m.textContent = (await r.json()).error || 'Could not log in';
};
</script>
</body></html>
